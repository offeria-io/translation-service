apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-service
  namespace: offeria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: translation-service
  template:
    metadata:
      labels:
        app: translation-service
    spec:
      containers:
        - name: translation-service
          image: offeria/translation-service:latest
          ports:
            - containerPort: 8089
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: translation-service
  namespace: offeria
spec:
  selector:
    app: translation-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8089
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: translation-service-config
  namespace: offeria
data:
  SPRING_PROFILES_ACTIVE: "prod"
